<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>골프 스코어 기록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>⛳ 골프 스코어</h1>
    <div id="status" role="status" aria-live="polite"></div>
  </header>

  <nav aria-label="주 메뉴">
    <select id="groupSelect" aria-label="그룹 선택"></select>
    <button class="tab active" data-tab="dashboard">분석</button>
    <button class="tab" data-tab="rounds">라운딩</button>
    <button class="tab" data-tab="groups">그룹/멤버</button>
    <button class="tab" data-tab="settings">설정</button>
  </nav>

  <main>
    <section id="tab-dashboard"></section>
    <section id="tab-rounds" hidden></section>
    <section id="tab-groups" hidden></section>
    <section id="tab-settings" hidden></section>
  </main>

  <dialog id="roundDialog"></dialog>

  <script src="app.js"></script>
</body>
</html>
